name: Build standalone rfpack.exe

# Produces a single Windows .exe that needs no Python install on the
# machine that runs it - the point of a tool meant to be copied onto a
# PC you don't control and run immediately.
#
# - Push a tag like "v1.1.0" to build the exe and attach it to a new
#   GitHub Release automatically.
# - Or run this workflow manually (Actions tab -> Run workflow) to get
#   a downloadable build without cutting a release, e.g. to test a change.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller zstandard

      - name: Build rfpack.exe
        run: |
          pyinstaller --onefile --name rfpack --console rfpack.py

      - name: Smoke-test the built exe
        run: |
          .\dist\rfpack.exe doctor
          .\dist\rfpack.exe --version

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rfpack-windows-exe
          path: dist/rfpack.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rfpack.exe
          generate_release_notes: true
